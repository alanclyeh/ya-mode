<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" font-family="'PingFang TC','Noto Sans TC','Helvetica Neue',Arial,sans-serif">
<title>ya-mode Code flow v0.1.0</title>
<desc>Plan, Implement, Tests, Gates, Review, Opening a PR. Review loops back to Gates when code changed, at most three rounds.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.l{stroke:#73726c;stroke-width:1.5;fill:none}
.h{font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central}
.s{font-size:12px;text-anchor:middle;dominant-baseline:central}
.p rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.p .h{fill:#3C3489}.p .s{fill:#534AB7}
.g rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.g .h{fill:#444441}.g .s{fill:#5F5E5A}
.m rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.5}.m .h{fill:#633806}.m .s{fill:#854F0B}
</style>
</defs>
<rect width="680" height="340" fill="#ffffff"/>

<g class="p"><rect x="40" y="24" width="180" height="56" rx="8"/><text class="h" x="130" y="42">Plan</text><text class="s" x="130" y="62">使用者先核准</text></g>
<g class="p"><rect x="250" y="24" width="180" height="56" rx="8"/><text class="h" x="340" y="42">Implement</text><text class="s" x="340" y="62">可平行才派 ya-agent</text></g>
<g class="p"><rect x="460" y="24" width="180" height="56" rx="8"/><text class="h" x="550" y="42">Tests</text><text class="s" x="550" y="62">bug fix 先寫失敗測試</text></g>
<line class="l" x1="220" y1="52" x2="248" y2="52" marker-end="url(#a)"/>
<line class="l" x1="430" y1="52" x2="458" y2="52" marker-end="url(#a)"/>
<path class="l" d="M550 80 L550 117 L130 117 L130 152" marker-end="url(#a)"/>

<g class="p"><rect x="40" y="154" width="180" height="56" rx="8"/><text class="h" x="130" y="172">Gates</text><text class="s" x="130" y="192">test、typecheck、lint</text></g>
<g class="p"><rect x="250" y="154" width="180" height="56" rx="8"/><text class="h" x="340" y="172">Review</text><text class="s" x="340" y="192">opus + sonnet 獨立審</text></g>
<g class="g"><rect x="460" y="154" width="180" height="56" rx="8"/><text class="h" x="550" y="172">Opening a PR</text><text class="s" x="550" y="192">code playbook 最後一步</text></g>
<line class="l" x1="220" y1="172" x2="248" y2="172" marker-end="url(#a)"/>
<line class="l" x1="248" y1="192" x2="220" y2="192" marker-end="url(#a)"/>
<line class="l" x1="430" y1="182" x2="458" y2="182" marker-end="url(#a)"/>
<text x="40" y="236" font-size="12" fill="#5F5E5A">改過 code 就回 Gates,最多 3 輪</text>

<line class="l" x1="340" y1="212" x2="340" y2="248" marker-end="url(#a)"/>
<g class="m"><rect x="250" y="250" width="180" height="56" rx="8"/><text class="h" x="340" y="268">第 3 輪仍有 blocking</text><text class="s" x="340" y="288">停下,列給使用者</text></g>

<text x="640" y="330" font-size="11" fill="#888780" text-anchor="end">ya plugin v0.1.0</text>
</svg>
